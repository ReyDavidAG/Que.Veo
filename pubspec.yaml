name: cinemapedia
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  animate_do: ^4.2.0
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  dio: ^5.7.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^2.6.1
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^16.0.0
  intl: ^0.20.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.28.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  rename: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true

  # Foreground (tu pictograma con transparencia)
  image_path: "assets/icon.png"

  # ANDROID: Adaptive icon
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_background: "#121A34"
  adaptive_icon_monochrome: "assets/icon.png" # Android 13+

  # iOS: NO quites alpha o se verá un círculo/rectángulo sólido
  remove_alpha_ios: false

flutter_native_splash:
  android: true
  ios: true

  # Colores de fondo
  color: "#0E1427"
  color_dark: "#121A34"

  # Usamos la MISMA imagen como logo
  image: assets/splash/splash.png
  image_dark: assets/splash/splash.png

  # En Android ≤ 11 e iOS: fondo full-bleed (misma imagen)
  background_image: assets/splash/splash.png
  background_image_dark: assets/splash/splash.png

  # Ajustes para rellenar
  ios_content_mode: scaleAspectFill
  android_gravity: fill

  android_12:
    # Android 12+ NO admite background_image (limitación del SO)
    color: "#0E1427"
    color_dark: "#121A34"
    image: assets/splash/splash.png
    image_dark: assets/splash/splash.png

  fullscreen: true
